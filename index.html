<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Bouncing Orbs</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.3.1/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/addons/p5.sound.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="wrap">

    <div class="leftWrap" id="leftWrap"></div>

    <div class="rightWrap">
        <span class="panelLabel"><span class="liveDot"></span>HOW TO PLAY</span>

        <h2>Survive the Orbs</h2>

        <p class="description">
            Dodge the bouncing orbs and survive as long as possible.
            Collect boosts to temporarily increase your movement speed.
        </p>

        <div class="controls">
            <p><span>W A S D</span> Move player</p>
            <p><span>Mouse</span> Shoot when possible</p>
            <p><span>C</span> Reset game</p>
            <p><span>V</span> Change colors</p>
        </div>
    </div>

</div>

<script src="sketch.js"></script>

</body>
</html>
